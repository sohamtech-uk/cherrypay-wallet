# Azure ingress appends its verified client IP at the right of X-Forwarded-For.
# This container's only ingress must be Azure's HTTP proxy (8080).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 32k;
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://horizon-testnet.stellar.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # Never replay a submitted payment on upstream failure.
        proxy_next_upstream off;
    }
    location = /health { proxy_pass http://127.0.0.1:3001/health; }
    location = /ready { proxy_pass http://127.0.0.1:3001/ready; }
    location = /web-health { access_log off; return 200 'ok'; }
    location / {
        add_header Cache-Control no-store;
        # Repeat security headers because nginx add_header is not inherited here.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://horizon-testnet.stellar.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
