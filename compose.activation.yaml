# Testnet opt-in configuration. Supply secrets through deployment secret injection.
# docker compose -f compose.yaml -f compose.activation.yaml config --quiet
services:
  api:
    environment:
      WALLET_DEPLOYMENTS_ENABLED: ${WALLET_DEPLOYMENTS_ENABLED:-false}
      WALLET_TESTNET_FUNDING_ENABLED: ${WALLET_TESTNET_FUNDING_ENABLED:-true}
      STELLAR_DEPLOYER_SECRET: ${STELLAR_DEPLOYER_SECRET:-}
      STELLAR_DEPLOYER_PUBLIC_KEY: ${STELLAR_DEPLOYER_PUBLIC_KEY:-}
      WALLET_DEPLOYMENT_MAX_FEE_STROOPS: ${WALLET_DEPLOYMENT_MAX_FEE_STROOPS:-100000000}
      WALLET_DEPLOYMENT_PILOT_LIMIT: ${WALLET_DEPLOYMENT_PILOT_LIMIT:-0}
      WALLET_INDEXER_ENABLED: ${WALLET_INDEXER_ENABLED:-false}
      WALLET_INDEXER_NETWORK: TESTNET
      WALLET_INDEXER_URL: ${WALLET_INDEXER_URL:-}
      WALLET_INDEXER_SIGNING_SECRET: ${WALLET_INDEXER_SIGNING_SECRET:-}
