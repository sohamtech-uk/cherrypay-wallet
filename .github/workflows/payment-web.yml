name: Payment frontend checks
on:
  pull_request:
    paths: ['apps/web/**', '.github/workflows/payment-web.yml']
  push:
    branches: [develop]
    paths: ['apps/web/**', '.github/workflows/payment-web.yml']
permissions:
  contents: read
jobs:
  payment-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
      - run: npm test
